
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>교과 세특 열람 시스템</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <script src="script.js" defer></script>
</head>
<body>
  <main class="container">
    <div class="emblem">📖</div>
    <h2>교과 세특 열람 시스템</h2>
    <p class="subtitle">학번과 비밀번호로 본인의 세특을 확인하세요</p>
    <label>학번<br><input type="text" id="studentId" placeholder="예: 20101" /></label>
    <label>이름<br><input type="text" id="name" placeholder="예: 홍길동" /></label>
    <label>비밀번호<br><input type="password" id="password" placeholder="4자리 숫자" /></label>
    <button onclick="search()">조회하기 🔍</button>
    <div id="result"></div>
  </main>
  <footer><span class="footer-badge">© 2025 <span class="footer-name">Teachercho84</span></span></footer>
</body>
</html>
